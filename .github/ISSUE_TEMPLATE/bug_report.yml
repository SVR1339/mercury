name: 🐛 Bug Report
description: Report a problem or unexpected behavior in Mercury
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us resolve it quickly.
  - type: input
    id: version
    attributes:
      label: Mercury Version
      description: What version of Mercury are you running? (e.g. v1.0.0 or `mercury --version`)
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - macOS Apple Silicon (M1/M2/M3/M4)
        - macOS Intel (x64)
        - Linux
    validations:
      required: true
  - type: textarea
    id: command-or-repo
    attributes:
      label: Command or Repository URL
      description: What command or repository were you attempting to install or run?
      placeholder: "e.g. irm https://... | iex or https://github.com/..."
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: What actually happened? Please paste any error output or log snippets from `%LOCALAPPDATA%\Mercury\logs\`.
      render: shell
    validations:
      required: true
